[package]
name = "tts"
version = "0.1.0"
edition = "2021"
description = "Qwen3-TTS server wrapper: supervises KoboldCpp and serves the web UI"
publish = false

[[bin]]
name = "tts"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread","macros","process","signal","time","fs","io-util","net"] }
axum = { version = "0.8", features = ["multipart","json"] }
reqwest = { version = "0.12", default-features = false, features = ["json","stream","multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
